name: Update ETF dashboard and send Telegram link
on:
  schedule:
    - cron: '37 20 * * *'  # 05:37 Asia/Seoul; off the hour to reduce GitHub schedule delays
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch latest official holdings
        type: boolean
        default: true
      backfill_koact:
        description: Fill past KoAct holdings into history (stops on rate limit; re-run to continue)
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-dashboard
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Refresh official public holdings
        if: github.event_name == 'schedule' || inputs.refresh
        run: node --use-system-ca refresh.mjs
      - name: Backfill KoAct holdings history
        if: inputs.backfill_koact
        run: node --use-system-ca backfill-koact.mjs
      - name: Verify latest FunETF bio comparison before publication
        run: node refresh-bio-comparison.mjs
      - name: Verify latest US ETF comparison before publication
        run: node refresh-bio-comparison.mjs us
      - name: Verify latest KOSPI ETF comparison before publication
        run: node refresh-bio-comparison.mjs kospi
      - name: Verify latest KOSDAQ ETF comparison before publication
        run: node refresh-bio-comparison.mjs kosdaq
      - run: node build-dashboard.mjs
      - name: Build latest all-holdings dashboard
        run: node build-all-holdings.mjs
      - name: Build protected standalone bio page
        run: node build-bio-protected.mjs output/site/bio-share
      - name: Save public holdings history
        run: |
          git config user.name 'ETF dashboard bot'
          git config user.email 'etf-dashboard@users.noreply.github.com'
          git add state/cumulative.json state/bio-comparison.json state/bio-comparison-history.json state/us-comparison.json state/us-comparison-history.json state/kospi-comparison.json state/kospi-comparison-history.json state/kosdaq-comparison.json state/kosdaq-comparison-history.json state/period-holdings.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public ETF holdings history'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send published dashboard link
        run: node notify.mjs
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}all-holdings/?v=${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
